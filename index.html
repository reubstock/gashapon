<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GASHAPON × SERIAL KILLERS</title>
<style>
  :root {
    --bg: #0a0a0f;
    --bg-soft: #15151c;
    --fg: #ece8de;
    --accent: #d8233b;
    --gold: #f5b800;
    --muted: #6b6b75;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Courier New', ui-monospace, monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid #25252e;
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 8px;
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 5px;
    color: var(--accent);
    font-weight: 900;
  }
  header h1 span { color: var(--fg); letter-spacing: 2px; font-size: 14px; margin-left: 8px; }
  header .sub {
    font-size: 11px; letter-spacing: 2px; color: var(--muted);
  }

  #stage {
    position: relative;
    width: 100%;
    height: 58vh;
    min-height: 420px;
    background:
      radial-gradient(ellipse at 50% 60%, #1d1d2a 0%, #0a0a0f 70%),
      var(--bg);
    overflow: hidden;
  }
  #canvas { width: 100%; height: 100%; display: block; }

  #controls {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 5;
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: 2px solid #fff;
    padding: 12px 22px;
    font: 700 13px/1 'Courier New', monospace;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #000;
    transition: transform 0.05s, box-shadow 0.05s;
  }
  .btn:hover:not(:disabled) { transform: translate(1px, 1px); box-shadow: 3px 3px 0 #000; }
  .btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn.open { background: var(--gold); color: #000; }

  #info-card {
    position: absolute;
    top: 24px; right: 24px;
    width: 280px;
    background: rgba(15,15,22,0.92);
    border: 1px solid #2a2a36;
    padding: 16px;
    font-size: 12px;
    opacity: 0; transform: translateX(20px);
    transition: opacity 0.4s, transform 0.4s;
    pointer-events: none;
    z-index: 6;
  }
  #info-card.show { opacity: 1; transform: translateX(0); }
  #info-card .num {
    font-size: 10px; color: var(--gold);
    letter-spacing: 3px; margin-bottom: 8px;
  }
  #info-card .name {
    color: var(--accent);
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 4px;
    font-weight: 900;
  }
  #info-card .alias {
    color: var(--fg);
    font-style: italic;
    margin-bottom: 12px;
    font-size: 11px;
  }
  #info-card .stat {
    color: var(--muted);
    letter-spacing: 1px;
    line-height: 1.9;
    font-size: 11px;
  }

  #counter {
    position: absolute;
    top: 24px; left: 24px;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    z-index: 5;
  }
  #counter b { color: var(--gold); font-size: 14px; }

  #collection {
    padding: 28px 24px 40px;
    border-top: 1px solid #25252e;
  }
  #collection h2 {
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--muted);
    margin: 0 0 18px;
    text-align: center;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 760px;
    margin: 0 auto;
  }
  .card {
    background: var(--bg-soft);
    border: 1px solid #25252e;
    padding: 14px;
    position: relative;
    min-height: 108px;
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 14px;
    align-items: center;
    filter: grayscale(1) brightness(0.45);
    transition: filter 0.4s, border-color 0.4s;
  }
  .head-svg {
    width: 72px;
    height: 72px;
    display: block;
  }
  .card.owned {
    filter: none;
    border-color: var(--gold);
  }
  .card .num {
    position: absolute; top: 6px; right: 10px;
    font-size: 9px; color: var(--muted);
    letter-spacing: 1px;
  }
  .card .swatch {
    width: 36px; height: 36px;
    border: 2px solid #fff;
    border-radius: 50%;
    box-shadow: 2px 2px 0 #000;
    position: relative;
    overflow: hidden;
  }
  .card .swatch::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; bottom: 0;
    background: var(--b);
  }
  .card .swatch { background: var(--a); }
  .card .meta .name {
    font-size: 13px; font-weight: 900;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .card .meta .alias {
    font-size: 10px;
    color: var(--fg);
    font-style: italic;
  }
  .card.owned::after {
    content: '◆ OWNED';
    position: absolute;
    bottom: 6px; right: 8px;
    font-size: 9px; letter-spacing: 1px;
    color: var(--gold);
    font-weight: 900;
  }

  footer {
    padding: 14px 24px 28px;
    font-size: 10px; color: var(--muted);
    text-align: center; letter-spacing: 1px;
    line-height: 1.7;
  }

  /* DOSSIER section */
  #dossier {
    padding: 28px 24px 12px;
    max-width: 760px;
    margin: 0 auto;
    border-top: 1px solid #25252e;
  }
  .dossier-header {
    display: flex; gap: 14px; align-items: baseline;
    font-size: 11px; letter-spacing: 3px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .d-label { color: var(--muted); }
  #d-current { color: var(--accent); font-weight: 900; font-size: 14px; letter-spacing: 2px; }
  #d-current.idle { color: var(--muted); font-weight: 400; letter-spacing: 3px; }

  .dossier-form {
    display: grid;
    grid-template-columns: 1fr 1.4fr auto;
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 600px) {
    .dossier-form { grid-template-columns: 1fr; }
  }
  .dossier-form input {
    background: var(--bg-soft);
    border: 1px solid #2a2a36;
    color: var(--fg);
    padding: 11px 13px;
    font: 12px/1 'Courier New', ui-monospace, monospace;
    letter-spacing: 1px;
  }
  .dossier-form input::placeholder { color: #4a4a55; }
  .dossier-form input:focus { outline: none; border-color: var(--accent); }
  .dossier-form input:disabled { opacity: 0.35; cursor: not-allowed; }
  #d-btn { background: var(--gold); color: #000; }

  .d-file {
    border: 1px solid var(--gold);
    background: rgba(245, 184, 0, 0.035);
    padding: 18px 20px;
    font-size: 12px;
    letter-spacing: 1px;
    line-height: 1.7;
    margin-bottom: 14px;
    animation: fileIn 0.4s ease-out;
  }
  @keyframes fileIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .d-fileheader {
    display: flex;
    justify-content: space-between;
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #3a3a48;
  }
  .d-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 10px;
    font-size: 11px;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .d-key { color: var(--muted); letter-spacing: 2px; }
  .d-val { color: var(--fg); }
  .d-divider {
    border-top: 1px dashed #3a3a48;
    margin: 14px 0 10px;
  }
  .d-narrative {
    color: var(--accent);
    font-size: 13px;
    font-style: italic;
    line-height: 1.85;
    letter-spacing: 0.5px;
    padding: 6px 0 2px;
  }

  .card.owned { cursor: pointer; }
  .card.active {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 2px var(--accent), 4px 4px 0 #000;
  }
  .card .meta { min-width: 0; }
  .card .wiki {
    display: inline-block;
    margin-top: 4px;
    font-size: 9px; letter-spacing: 2px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
    padding-bottom: 1px;
  }
  .card.owned .wiki { color: var(--fg); border-color: var(--fg); }
  .card .wiki:hover { color: var(--accent); border-color: var(--accent); }
  .card .rarity-pill {
    display: inline-block;
    font-size: 8px;
    letter-spacing: 2px;
    padding: 2px 6px;
    margin-top: 6px;
    border: 1px solid var(--rcolor, var(--muted));
    color: var(--rcolor, var(--muted));
    background: rgba(0,0,0,0.3);
  }
  .card .dupes {
    position: absolute;
    bottom: 8px; left: 10px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--gold);
    font-weight: 900;
  }
  .card.owned::after { display: none; }

  /* info card rarity + wiki */
  #info-card .rarity-pill {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 3px 8px;
    margin: 4px 0 8px;
    border: 1px solid var(--rcolor, var(--muted));
    color: var(--rcolor, var(--muted));
    background: rgba(0,0,0,0.3);
  }
  #info-card .wiki-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px; letter-spacing: 2px;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px dotted var(--gold);
    padding-bottom: 1px;
  }
  #info-card .wiki-link:hover { color: var(--fg); border-color: var(--fg); }
  #info-card.duplicate { border-color: var(--accent); }
  #info-card .dup-stamp {
    font-size: 22px;
    color: var(--accent);
    font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 8px;
    transform: rotate(-3deg);
    display: inline-block;
    border: 3px solid var(--accent);
    padding: 4px 10px;
  }
  #info-card .dup-line {
    font-size: 13px;
    color: var(--fg);
    line-height: 1.5;
    margin-top: 8px;
    font-style: italic;
  }

  /* drop rates — collapsible button at top */
  #rates {
    padding: 14px 24px 0;
    max-width: 760px;
    margin: 0 auto;
    text-align: center;
  }
  #rates-toggle {
    background: var(--bg-soft);
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 10px 22px;
    font: 700 11px/1 'Courier New', ui-monospace, monospace;
    letter-spacing: 4px;
    cursor: pointer;
    box-shadow: 3px 3px 0 #000;
    transition: transform 0.05s, box-shadow 0.05s, background 0.2s;
    display: inline-block;
  }
  #rates-toggle:hover { background: rgba(245, 184, 0, 0.08); }
  #rates-toggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
  #rates-toggle .arrow { display: inline-block; transition: transform 0.4s; }
  #rates-panel.open + #rates-toggle .arrow,
  #rates-toggle.is-open .arrow { transform: rotate(180deg); }

  #rates-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.45s ease-in-out, opacity 0.3s, padding 0.3s;
    opacity: 0;
    padding: 0 18px;
    background: var(--bg-soft);
    border: 1px solid #25252e;
    margin: 14px auto 0;
    text-align: left;
  }
  #rates-panel.open {
    max-height: 320px;
    opacity: 1;
    padding: 14px 18px;
  }
  .rates-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .rates-table th, .rates-table td {
    padding: 8px 10px;
    text-align: left;
    border-bottom: 1px dashed #25252e;
  }
  .rates-table th {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 3px;
    font-weight: 400;
  }
  .rates-table .rar { font-weight: 900; }
  .rates-table .pct { color: var(--gold); text-align: right; font-variant-numeric: tabular-nums; }
  .rates-table .pool { color: var(--muted); }
  .rates-countdown {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: right;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>GASHAPON <span>ガシャポン</span></h1>

</header>

<section id="rates">
  <button id="rates-toggle" type="button"><span class="arrow">▽</span> DROP RATES</button>
  <div id="rates-panel">
    <table class="rates-table">
      <thead>
        <tr><th>RARITY</th><th>POOL</th><th style="text-align:right">PER-FIGURE ODDS</th></tr>
      </thead>
      <tbody id="rates-body"></tbody>
    </table>
    <div class="rates-countdown" id="rates-countdown"></div>
  </div>
</section>

<div id="stage">
  <div id="counter">COLLECTED <b id="count">0</b> / 09</div>
  <canvas id="canvas"></canvas>

  <div id="info-card">
    <div class="body"></div>
  </div>

  <div id="controls">
    <button class="btn" id="dropBtn">★ DROP CAPSULE</button>
    <button class="btn open" id="openBtn" disabled>◎ OPEN</button>
  </div>
</div>

<section id="dossier">
  <div class="dossier-header">
    <span class="d-label">CURRENT SUBJECT</span>
    <span id="d-current" class="idle">— DROP A CAPSULE —</span>
  </div>
  <div class="dossier-form">
    <input id="d-name" type="text" placeholder="TARGET NAME" maxlength="80" disabled autocomplete="off">
    <input id="d-desc" type="text" placeholder="DESCRIPTION OR LINK (OPTIONAL)" maxlength="240" disabled autocomplete="off">
    <button id="d-btn" class="btn" disabled>► INTRODUCE TO</button>
  </div>
  <div id="d-output"></div>
</section>

<section id="collection">
  <h2>YOUR COLLECTION</h2>
  <div id="grid"></div>
</section>

<footer>
  A satirical kitsch art experiment in vinyl-toy form ·<br>
  Stylized after iconic visual identifiers only · No graphic content depicted
</footer>

          shirt:0x4a6fa5, shirtPattern:'denim', mouth:'flat' } },
  { id:'holmes', name:'H.H. Holmes', alias:'Devil in the White City', years:'1891–1894',
    rarity:'rare', wiki:'https://en.wikipedia.org/wiki/H._H._Holmes',
    capsule:[0x3e2723, 0xd7ccc8],
    toy:{ skin:0xebc59e, hair:{color:0x1a1a1a, style:'partedShort'}, eyes:'default',
          shirt:0x1a1a1a, mustache:true, hat:'bowler', mouth:'flat' } },
  { id:'ripper', name:'Jack the Ripper', alias:'Whitechapel Phantom', years:'1888',
    rarity:'legendary', wiki:'https://en.wikipedia.org/wiki/Jack_the_Ripper',
    capsule:[0x1a1a1a, 0xc62828],

          shirt:0x1a1a1a, cape:true, mouth:'none' } },
  { id:'gein', name:'Ed Gein', alias:'The Butcher of Plainfield', years:'1954–1957',
    rarity:'rare', wiki:'https://en.wikipedia.org/wiki/Ed_Gein',
    capsule:[0x6d4c41, 0xc62828],
    toy:{ skin:0xead7b6, hair:{color:0x8d7053, style:'thinning'}, eyes:'gaunt',
          shirt:0xa83333, shirtPattern:'plaid', mouth:'flat' } },
  { id:'ramirez', name:'Richard Ramirez', alias:'The Night Stalker', years:'1984–1985',
    rarity:'uncommon', wiki:'https://en.wikipedia.org/wiki/Richard_Ramirez',
    capsule:[0x1a1a1a, 0xfdd835],
    toy:{ skin:0xd1a679, hair:{color:0x111111, style:'longBlack'}, eyes:'sunglasses',
          shirt:0x1a1a1a, mark:'pentagram', mouth:'flat' } },
];
const KILLERS_BY_ID = Object.fromEntries(KILLERS.map(k => [k.id, k]));

const RARITY = {
  common:    { label:'COMMON',    weight:20, color:'#9aa0aa' },
  uncommon:  { label:'UNCOMMON',  weight:10, color:'#4caf50' },
  rare:      { label:'RARE',      weight: 5, color:'#42a5f5' },
  legendary: { label:'LEGENDARY', weight: 2, color:'#f5b800' },
};

function pickKillerByWeight() {
  const total = KILLERS.reduce((s, k) => s + RARITY[k.rarity].weight, 0);
  let r = Math.random() * total;
  for (const k of KILLERS) {
    r -= RARITY[k.rarity].weight;
    if (r < 0) return k;
  }
  return KILLERS[KILLERS.length - 1];
}

   ============================================================ */
function buildCapsule(colorA, colorB) {
  const group = new THREE.Group();
  const R = 0.18;
  const matA = new THREE.MeshStandardMaterial({ color: colorA, roughness: 0.35 });
  const matB = new THREE.MeshStandardMaterial({ color: colorB, roughness: 0.35 });

  const top = new THREE.Mesh(
    new THREE.SphereGeometry(R, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), matA);
  top.castShadow = true; group.add(top);

  const bot = new THREE.Mesh(
    new THREE.SphereGeometry(R, 24, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), matB);
  bot.castShadow = true; group.add(bot);

  const seam = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.008, 6, 32),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  seam.rotation.x = Math.PI / 2;
  group.add(seam);

  group.userData = { top, bot, seam };
  return group;
}

// Place capsules in globe
const capsules = [];
KILLERS.forEach((k, i) => {
  const c = buildCapsule(k.capsule[0], k.capsule[1]);
  c.userData.killerId = k.id;
  c.userData.idx = i;
  const phi = Math.random() * Math.PI * 2;
  const theta = Math.acos(2 * Math.random() - 1);
  const r = 0.3 + Math.random() * 0.4;
  c.position.set(
    MACHINE_POS.x + r * Math.sin(theta) * Math.cos(phi),
    MACHINE_POS.y + 0.78 + r * Math.cos(theta) * 0.85,
    MACHINE_POS.z + r * Math.sin(theta) * Math.sin(phi)
  );
  c.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
  c.userData.basePos = c.position.clone();
  scene.add(c);
  capsules.push(c);
});

  }
  if (config.mouth === 'flat') {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.008, 0.01),
      new THREE.MeshBasicMaterial({ color: 0x111111 })
    );
    m.position.set(0, 0.57, eyeZ); g.add(m);
  }
  if (config.mouth === 'clownSmile') {
    const m = new THREE.Mesh(
      new THREE.TorusGeometry(0.09, 0.018, 8, 18, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0xc62828 })
    );
    m.position.set(0, 0.62, eyeZ); m.rotation.z = Math.PI; g.add(m);
  }

  // FOREHEAD MARK (Manson X)
  if (config.mark === 'forehead-x') {
    const markMat = new THREE.MeshBasicMaterial({ color: 0x6a0000 });
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.016, 0.01), markMat);
    b1.position.set(0, 0.84, eyeZ); b1.rotation.z = Math.PI / 4; g.add(b1);
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.016, 0.01), markMat);
    b2.position.set(0, 0.84, eyeZ); b2.rotation.z = -Math.PI / 4; g.add(b2);
  }
  // PENTAGRAM (Ramirez shirt)
  if (config.mark === 'pentagram') {
    const starMat = new THREE.MeshBasicMaterial({ color: 0xb71c1c });
    const star = new THREE.Mesh(new THREE.RingGeometry(0.04, 0.07, 5), starMat);
    star.position.set(0, 0.2, 0.235); g.add(star);
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.025, 5),
      new THREE.MeshBasicMaterial({ color: 0xb71c1c }));
    dot.position.set(0, 0.2, 0.236); g.add(dot);
  }

  return g;
}

function roundedBox(w, h, d, r) {
  // Simple approximation — BoxGeometry; rounding is cosmetic and not critical at this scale.
  return new THREE.BoxGeometry(w, h, d);
}

/* ============================================================
   TWEEN HELPERS
   ============================================================ */
const tweens = [];
function tween(setter, from, to, duration, easing = easeOutQuad, onComplete) {
  tweens.push({ setter, from, to, duration, easing, onComplete, start: performance.now() });
}
const easeOutQuad = t => t * (2 - t);
const easeInQuad = t => t * t;
const easeInOut = t => t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
const easeOutBack = t => { const c = 1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const easeOutBounce = t => {
  const n1 = 7.5625, d1 = 2.75;
  if (t < 1/d1) return n1 * t * t;
  if (t < 2/d1) return n1 * (t -= 1.5/d1) * t + 0.75;
  if (t < 2.5/d1) return n1 * (t -= 2.25/d1) * t + 0.9375;
  return n1 * (t -= 2.625/d1) * t + 0.984375;
};

function updateTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const t = Math.min(1, (now - tw.start) / tw.duration);
    const eased = tw.easing(t);
    if (typeof tw.from === 'number') {
      tw.setter(tw.from + (tw.to - tw.from) * eased);
    } else if (tw.from.isVector3) {
      tw.setter(new THREE.Vector3().lerpVectors(tw.from, tw.to, eased));
    }
    if (t >= 1) { tweens.splice(i, 1); tw.onComplete && tw.onComplete(); }
  }
}

function buildHeadSVG(k) {
  const t = k.toy;
  const skin = hex(t.skin);
  const hairColor = t.hair ? hex(t.hair.color) : '#222';
  const capColor = hex(k.capsule[1]);

  let parts = '';

  // Head (drawn before hair/hat so they overlay)
  parts += `<circle cx="50" cy="44" r="22" fill="${skin}" stroke="#000" stroke-width="2"/>`;

  // Hair / hat
  if (t.hair?.style === 'tophat') {
    parts += `<rect x="36" y="6" width="28" height="22" fill="#0a0a0a" stroke="#000" stroke-width="1.6"/>`;
    parts += `<rect x="36" y="20" width="28" height="3" fill="#c62828"/>`;
    parts += `<rect x="28" y="26" width="44" height="4" fill="#0a0a0a" stroke="#000" stroke-width="1.6"/>`;
  } else if (t.hat === 'bowler') {
    parts += `<path d="M 32 28 Q 50 14 68 28 Z" fill="#1a1a1a" stroke="#000" stroke-width="1.6"/>`;
    parts += `<rect x="26" y="27" width="48" height="4" fill="#1a1a1a" stroke="#000" stroke-width="1.6"/>`;
  } else if (t.hair) {
    const hs = t.hair.style;
    if (hs === 'parted') {
      parts += `<path d="M 32 32 Q 32 22 42 22 Q 50 28 58 22 Q 68 22 68 32 Q 60 28 50 30 Q 40 28 32 32 Z" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;
    } else if (hs === 'partedShort') {
      parts += `<path d="M 32 30 Q 38 22 50 26 Q 62 22 68 30 Q 60 28 50 30 Q 40 28 32 30 Z" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;
    } else if (hs === 'curtains') {
      parts += `<path d="M 30 30 Q 30 16 50 14 Q 70 16 70 30 L 68 42 L 60 36 Q 50 32 40 36 L 32 42 Z" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;
    } else if (hs === 'longBeard') {
      parts += `<path d="M 28 32 Q 28 14 50 12 Q 72 14 72 32 L 72 50 L 28 50 Z" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;
    } else if (hs === 'longBlack') {
      parts += `<path d="M 28 30 Q 28 12 50 12 Q 72 12 72 30 L 76 66 L 70 60 Q 60 56 50 56 Q 40 56 30 60 L 24 66 Z" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;
    } else if (hs === 'frizzy') {
      for (let i = 0; i <= 6; i++) {
        const a = (i / 6) * Math.PI + Math.PI;
        const x = 50 + Math.cos(a) * 25;
        const y = 32 + Math.sin(a) * 16;
        parts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${hairColor}" stroke="#000" stroke-width="1.2"/>`;

      parts += `<circle cx="72" cy="42" r="11" fill="${hairColor}" stroke="#000" stroke-width="1.5"/>`;

  const eye = (cx, cy = 44) => `<circle cx="${cx}" cy="${cy}" r="2" fill="#000"/>`;

    parts += `<circle cx="58" cy="44" r="6.5" fill="none" stroke="#000" stroke-width="1.5"/>`;

    parts += `<rect x="33" y="40" width="15" height="8" fill="#000" stroke="#000" stroke-width="1"/>`;

    parts += `<line x1="48" y1="44" x2="52" y2="44" stroke="#000" stroke-width="1.2"/>`;

    parts += `<ellipse cx="58" cy="44" rx="5" ry="3.5" fill="#2a2a2a"/>`;
    parts += `<circle cx="42" cy="44" r="1.2" fill="#000"/>`;
    parts += `<circle cx="58" cy="44" r="1.2" fill="#000"/>`;
  } else if (eyes === 'glowing') {
    parts += `<circle cx="42" cy="44" r="3.5" fill="#fff170"/>`;
    parts += `<circle cx="58" cy="44" r="3.5" fill="#fff170"/>`;
    parts += `<circle cx="42" cy="44" r="6" fill="#fff170" opacity="0.35"/>`;
    parts += `<circle cx="58" cy="44" r="6" fill="#fff170" opacity="0.35"/>`;
  } else if (eyes === 'paintTriangles') {

    parts += `<path d="M 38 38 L 42 30 L 46 38 Z" fill="#c62828"/>`;

    parts += `<path d="M 38 50 L 42 58 L 46 50 Z" fill="#c62828"/>`;
    parts += `<path d="M 54 50 L 58 58 L 62 50 Z" fill="#c62828"/>`;
  }

  // Mustache
  if (t.mustache) {
    parts += `<path d="M 42 52 Q 50 56 58 52 Q 56 54 50 54 Q 44 54 42 52 Z" fill="#1a1a1a" stroke="#000" stroke-width="1"/>`;
  }

  // Mouth
  if (t.mouth === 'clownSmile') {
    parts += `<path d="M 40 54 Q 50 62 60 54" stroke="#c62828" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  } else if (t.mouth && t.mouth !== 'none') {
    parts += `<line x1="46" y1="56" x2="54" y2="56" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>`;

  // Beard (Manson)
  if (t.hair?.style === 'longBeard') {
    parts += `<path d="M 38 54 Q 50 68 62 54 Q 60 64 50 66 Q 40 64 38 54 Z" fill="${hairColor}" stroke="#000" stroke-width="1.2"/>`;

  // Forehead mark
  if (t.mark === 'forehead-x') {
    parts += `<line x1="46" y1="28" x2="54" y2="34" stroke="#6a0000" stroke-width="2" stroke-linecap="round"/>`;

  }

  // Ruff (Gacy)
  let ruff = '';
  if (t.ruff) {
    ruff += `<path d="M 30 64 Q 40 60 50 64 Q 60 60 70 64 L 70 70 L 30 70 Z" fill="#fff" stroke="#000" stroke-width="1.5"/>`;
    ruff += `<circle cx="44" cy="66" r="2.5" fill="#e53935"/>`;

  return `<svg class="head-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

    <!-- highlight -->
    <path d="M 22 76 Q 28 90 46 92" stroke="rgba(255,255,255,0.45)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ============================================================
   DROP SEQUENCE
   ============================================================ */
function restoreCapsuleToGlobe(capsule) {
  if (!capsule) return;
  const { top, bot, seam, basePos } = capsule.userData;
  if (!top.parent) capsule.add(top);
  top.position.set(0, 0, 0);
  top.rotation.set(0, 0, 0);
  bot.scale.setScalar(1);
  seam.visible = true;
  // tween back to globe position
  tween(v => capsule.position.copy(v), capsule.position.clone(), basePos.clone(), 350);
}

function drop() {
  if (state === 'DROPPING' || state === 'OPENING') return;

  // restore previously dispensed capsule back to globe
  if (droppedCapsule) {
    restoreCapsuleToGlobe(droppedCapsule);
    droppedCapsule = null;
  }
  // clean prior revealed toy
  if (revealedToy) {
    const toy = revealedToy;
    tween(s => toy.scale.set(s, s, s), 1, 0.01, 250, easeInQuad, () => scene.remove(toy));
    revealedToy = null;
  }
  hideInfo();

  state = 'DROPPING';
  dropBtn.disabled = true;

  // weighted random pick by rarity
  const chosenKiller = pickKillerByWeight();
  const picked = capsules.find(c => c.userData.killerId === chosenKiller.id);

  const shakeStart = performance.now();
  const shakeDuration = 1100;

  function shakeFrame() {
    const t = (performance.now() - shakeStart) / shakeDuration;
    if (t < 1) {
      capsules.forEach(c => {
        if (c === picked) return;
        const base = c.userData.basePos;
        const tt = performance.now();
        c.position.x = base.x + Math.sin(tt * 0.012 + c.userData.idx * 2) * 0.09;
        c.position.y = base.y + Math.sin(tt * 0.018 + c.userData.idx) * 0.06;
        c.position.z = base.z + Math.cos(tt * 0.014 + c.userData.idx) * 0.09;
        c.rotation.x += 0.06;
        c.rotation.z += 0.05;
      });
      const tt = performance.now();
      const base = picked.userData.basePos;
      picked.position.x = base.x + Math.sin(tt * 0.020) * 0.07;
      picked.position.y = base.y + Math.sin(tt * 0.022) * 0.05;
      picked.position.z = base.z + Math.cos(tt * 0.018) * 0.07;
      picked.rotation.y += 0.1;
      requestAnimationFrame(shakeFrame);
    } else {
      capsules.forEach(c => {
        if (c === picked) return;
        tween(v => c.position.copy(v), c.position.clone(), c.userData.basePos.clone(), 400);
      });
      animateDrop(picked);
    }
  }
  shakeFrame();
}

function animateDrop(capsule) {
  droppedCapsule = capsule;
  const startPos = capsule.position.clone();
  // 1. exit globe through the bottom-front opening
  const exitPos = new THREE.Vector3(MACHINE_POS.x, MACHINE_POS.y + 0.05, MACHINE_POS.z + 0.4);
  tween(v => capsule.position.copy(v), startPos, exitPos, 500, easeInQuad, () => {
    // 2. slide & bounce into the tray
    const trayPos = new THREE.Vector3(MACHINE_POS.x, MACHINE_POS.y - 1.0, MACHINE_POS.z + 0.95);
    tween(v => capsule.position.copy(v), exitPos, trayPos, 750, easeOutBounce, () => {
      state = 'DISPENSED';
      openBtn.disabled = false;
    });
  });

  // continuous spin during fall
  const spinStart = performance.now();
  function spinFrame() {
    if (state !== 'DROPPING') return;
    if (performance.now() - spinStart < 1300) {
      capsule.rotation.x += 0.18;
      capsule.rotation.z += 0.13;
      requestAnimationFrame(spinFrame);
    }
  }
  spinFrame();
}

/* ============================================================
   OPEN SEQUENCE
   ============================================================ */
function openCapsule() {
  if (state !== 'DISPENSED') return;
  state = 'OPENING';
  openBtn.disabled = true;

  const capsule = droppedCapsule;
  const killerId = capsule.userData.killerId;
  const killer = KILLERS_BY_ID[killerId];
  const killerIdx = KILLERS.indexOf(killer);

  // glide to stage
  const stagePos = STAGE_POS.clone();
  tween(v => capsule.position.copy(v), capsule.position.clone(), stagePos, 700, easeInOut, () => {
    // settle rotation
    const startRot = { x: capsule.rotation.x, z: capsule.rotation.z };
    tween(r => capsule.rotation.x = r, startRot.x, 0, 400);
    tween(r => capsule.rotation.z = r, startRot.z, 0, 400, easeOutQuad, () => {
      // pop the top
      const top = capsule.userData.top;
      const bot = capsule.userData.bot;
      const seam = capsule.userData.seam;
      seam.visible = false;

      tween(y => top.position.y = y, 0, 1.6, 900, easeOutQuad);
      tween(r => top.rotation.x = r, 0, Math.PI * 1.5, 900);
      setTimeout(() => capsule.remove(top), 900);

      // spawn the toy emerging from inside
      const toy = buildToy(killer.toy);
      toy.position.set(stagePos.x, stagePos.y - 0.18, stagePos.z);
      toy.scale.set(0.01, 0.01, 0.01);
      scene.add(toy);
      revealedToy = toy;

      tween(s => toy.scale.set(s, s, s), 0.01, 1, 900, easeOutBack);
      tween(y => toy.position.y = y, stagePos.y - 0.18, stagePos.y - 0.05, 900, easeOutBack, () => {
        pulls[killerId] = (pulls[killerId] || 0) + 1;
        const count = pulls[killerId];
        const isDuplicate = count > 1;

        if (isDuplicate) {
          showDuplicate(killer, count);
        } else {
          collected.add(killerId);
          showInfo(killer, killerIdx);
          setDossierSubject(killer);
        }
        updateGrid();

        state = 'REVEALED';
        dropBtn.disabled = false;
        dropBtn.textContent = collected.size >= KILLERS.length ? '★ DROP AGAIN (ALL COLLECTED)' : '★ DROP ANOTHER';

        // fade bottom shell (kept in scene, just invisible until next drop restores it)
        setTimeout(() => {
          const fadeStart = performance.now();
          (function fadeBot(){
            const t = (performance.now() - fadeStart) / 500;
            if (t < 1) {
              bot.scale.setScalar(1 - t);
              requestAnimationFrame(fadeBot);
            } else {
              bot.scale.setScalar(0);
            }
          })();
        }, 700);
      });
    });
  });
}

/* ============================================================
   LOOP
   ============================================================ */
function animate() {
  const now = performance.now();
  updateTweens(now);

  if (state === 'READY') {
    capsules.forEach((c, i) => {
      c.position.y = c.userData.basePos.y + Math.sin(now * 0.001 + i) * 0.012;
      c.rotation.y += 0.004;
    });
  }
  if (revealedToy && state === 'REVEALED') {
    revealedToy.rotation.y += 0.009;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
